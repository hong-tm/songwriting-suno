name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run tests
        run: |
          set -e
          python3 scripts/selftest.py
          python3 -m unittest discover -s scripts/tests -t scripts/tests
